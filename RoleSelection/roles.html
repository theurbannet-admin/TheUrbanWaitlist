<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Role</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-content">
        <div class="card">
            
                
                <button type="button" class="back-icon" id="backToWaitlist" aria-label="Go Back To Waitlist">
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z"/></svg>
                </button>

                <div class="description">
                    <h2>How would you like to join?</h2>
                    <p>Tell us what brings you to TheUrbanNet so we can make your waitlist experience more relevant to you.</p>
                </div>

                <div class="roles">
                    <button class="role-btn" id="customerRole">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span>I’m looking for services</span>
                    </button>
                    <button class="role-btn" id="businessRole">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-briefcase"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
                        <span>I offer services</span>
                    </button>
                </div>

        </div> 
    </div>
    
   <script>
  const backToWaitlist = document.getElementById("backToWaitlist");
  const customerRole = document.getElementById("customerRole");
  const businessRole = document.getElementById("businessRole");

  /*
   * Marks the chosen role so it stays visibly pressed while the next page
   * loads, instead of springing back the moment the finger lifts.
   */
  function goTo(button, url) {
    button.addEventListener("click", function () {
      button.classList.add("active");
      window.location.href = url;
    });
  }

  backToWaitlist.addEventListener("click", function () {
    window.location.href = "../LandingPage/waitlist.html";
  });

  goTo(customerRole, "../CustomerForm/customer.html");
  goTo(businessRole, "../BusinessForm/business.html");
</script>
</body>
</html>

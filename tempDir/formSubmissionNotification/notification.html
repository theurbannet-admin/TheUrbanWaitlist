<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Successful Form Submission Notification</title>
</head> 
<body>

    <main class="submission-overlay">
  <section
    class="submission-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="success-title"
  >
    <div class="success-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M20.37 21.25a.75.75 0 0 1-.75.75H4.38a.75.75 0 0 1-.75-.75c0-4.1 4.5-7.28 8.37-7.28s8.37 3.18 8.37 7.28M17.1 7.11A5.1 5.1 0 1 1 12 2a5.11 5.11 0 0 1 5.1 5.11"
        />
      </svg>
    </div>

    <!-- <div class="confetti-bg"><img src="../assets/confetti-bg.svg" alt=""></div> -->

    <p class="success-eyebrow">YOU'RE IN</p>

    <div class="success-text">
      <h1 id="success-title">Welcome to <span>TheUrbanNet!</span></h1>

      <p>
        Check your inbox for your
        welcome email and UrbanNet guide, with more on what we offer and what
        happens next.
      </p>
    </div>

    
  </section>
</main>
    
   
</body>
</html>
